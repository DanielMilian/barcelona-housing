x-airflow-common: &airflow-common
  build: .
  image: housing-airflow:local
  env_file: .env
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.providers.fab.auth_manager.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    PYTHONPATH: /opt/airflow
    WAREHOUSE_HOST: warehouse
    WAREHOUSE_PORT: "5432"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./extract:/opt/airflow/extract
    - ./load:/opt/airflow/load
    - ./dbt:/opt/airflow/dbt
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./export:/opt/airflow/export
    - ./app:/opt/airflow/app
  depends_on:
    airflow-db:
      condition: service_healthy
    warehouse:
      condition: service_healthy



services:
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
      POSTGRES_DB: ${WAREHOUSE_DB}
    ports:
      - "${WAREHOUSE_PORT}:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./warehouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER} -d ${WAREHOUSE_DB}"]
      interval: 5s
      retries: 10

  dashboard:
    build: ./app
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_KEY: ${API_KEY}
      API_URL: http://api:8000
    volumes:
      - ./export:/export:ro
    restart: unless-stopped



  api:
    build: ./api
    environment:
      API_KEY: ${API_KEY}
      DATABASE_URL: postgresql+psycopg2://${WAREHOUSE_USER}:${WAREHOUSE_PASSWORD}@warehouse:5432/${WAREHOUSE_DB}
      AIRFLOW_API_URL: http://airflow-webserver:8080
      AIRFLOW_API_USER: ${AIRFLOW_API_USER}
      AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD}
    ports:
      - "8001:8000"
    depends_on:
      warehouse:
        condition: service_healthy

  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate && airflow users create --username admin --password $$AIRFLOW_ADMIN_PASSWORD --firstname Admin
      --lastname User --role Admin --email admin@example.com"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully




volumes:
  warehouse-data:
  airflow-db-data:

